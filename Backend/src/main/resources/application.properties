# Server config
server.port=8080

# Database config (H2 In-Memory for easy local testing - Disabled)
# spring.datasource.url=jdbc:h2:mem:collab_db;DB_CLOSE_DELAY=-1;MODE=MySQL
# spring.datasource.username=sa
# spring.datasource.password=
# spring.datasource.driver-class-name=org.h2.Driver

# H2 Console (Disabled)
# spring.h2.console.enabled=true
# spring.h2.console.path=/h2-console

# Original MySQL database config (Active)
spring.datasource.url=jdbc:mysql://localhost:3306/collab_platform?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA and Hibernate config
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Custom JWT config
app.jwt.secret=9a4f2c8d3b7a1e5f9c8d7b6a5e4f3c2b1a0e9d8c7b6a5e4f3c2b1a0e9d8c7b6a
app.jwt.expiration-ms=86400000
